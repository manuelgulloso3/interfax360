<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil del Usuario - Jagua Visión 360</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    .form-container {
      background-color: #fff;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0052cc;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Hoja de Vida y Servicios</h2>
    <form id="perfilForm">

      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required>

      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" name="direccion">

      <label for="perfil">Perfil profesional:</label>
      <textarea id="perfil" name="perfil" rows="4" placeholder="Escriba una breve descripción sobre usted"></textarea>

      <label for="experiencia">Experiencia laboral:</label>
      <textarea id="experiencia" name="experiencia" rows="4"></textarea>

      <label for="servicios">Servicios que ofrece:</label>
      <textarea id="servicios" name="servicios" rows="3"></textarea>

      <label for="archivo">Subir Hoja de Vida (PDF):</label>
      <input type="file" id="archivo" name="archivo" accept="application/pdf">

      <button type="submit">Guardar Perfil</button>
    </form>
  </div>

  <script>
    document.getElementById("perfilForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Perfil enviado correctamente. Gracias por confiar en Jagua Visión 360.");
      // Aquí podrías enviar los datos a un servidor con fetch() o AJAX
    });
  </script>
</body>
</html>
