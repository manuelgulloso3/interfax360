  <script src="patron.js"></script>
  <script>
  function buscar() {
    const texto = document.getElementById("busqueda").value.toLowerCase();
    const tarjetas = document.querySelectorAll(".tarjeta");

    let huboCoincidencia = false;

    tarjetas.forEach(tarjeta => {
      const contenido = tarjeta.textContent.toLowerCase();
      const visible = contenido.includes(texto);
      tarjeta.style.display = visible ? "block" : "none";
      if (visible) huboCoincidencia = true;
    });

    // Mostrar todas las secciones si hay texto en el buscador
    document.querySelectorAll(".tarjetas-box").forEach(seccion => {
      seccion.style.display = texto.trim() !== "" ? "block" : "";
    });
  }
</script>
